<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header>
        <div id="title-section">
            <h1 id="title-card">Questlog</h1>
            <button id="add-skill-button">
            + Add Skill
            </button>
        </div>
        <div class="stats-bar">
            <h2 id="level-display">Level: 1</h2>
            <h2 id="xp-display">XP: 100</h2>
            <h2 id="streak-display">Streak: 0</h2>
            <h2 id="best-streak">Best Streak: 0</h2>
        </div>
    </header>
    <main class="quest-board">
        <section>
            <h2>Quest board</h2>
            <div id="quests-container"></div>
            
        </section>
        <section>
            <h2>Skill Progress</h2>
            <div id="skills-container"></div>
        </section>
    </main>
    <div id="popup-overlay" class="hidden"></div>
    <div id="add-skill-popup" class="hidden">
        <h2>Add New Skill</h2>
        <div class="popup-label">
            <label for="skill-input">
                Skill Name
            </label>
            <br><br>
        </div>

        <input type="text" id="skill-input">
        <br><br>
        <div class="popup-buttons">
            <button id="confirm-add-skill">
                Add
            </button>

            <button id="cancel-add-skill">
                Cancel
            </button>
        </div>
        <h3 id="failed-to-add-skill" hidden></h3>
    </div>
    <script src="assets/Scripts/skills.js"></script>
    <script src="assets/Scripts/questTracking.js"></script>
    <script src="assets/Scripts/xp.js"></script>
    <script src="assets/Scripts/persistence.js"></script>
    <script src="assets/Scripts/resets.js"></script>
    <script src="assets/Scripts/streaks.js"></script>
    <script src="assets/Scripts/ui.js"></script>
    <script src="assets/scripts/main.js"></script>
</body>
</html>
